name: Sync upstream

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/eternityspring/shuohao-skills.git || true
          git fetch upstream main
          git checkout main
          git merge upstream/main --allow-unrelated-histories -X theirs -m "chore: sync upstream $(date -u)"
          git push origin main
